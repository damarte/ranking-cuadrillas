<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking Cuadrillas</title>
  <style>
    :root {
      --bg: #1a1208;
      --card: #2a1f12;
      --accent: #e8a33d;
      --text: #f3e9d8;
      --muted: #b8a488;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      max-width: 720px;
      padding: 24px 16px 8px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }
    .status.error { color: #e05c5c; }
    .status.ok { color: #7bc47f; }

    .ranking {
      width: 100%;
      max-width: 720px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: 44px 1fr 72px;
      align-items: center;
      background: var(--card);
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid transparent;
      transition: background 0.3s ease;
    }
    .row.top1 { border-color: var(--gold); }
    .row.top2 { border-color: var(--silver); }
    .row.top3 { border-color: var(--bronze); }

    .pos {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      color: var(--muted);
    }
    .row.top1 .pos { color: var(--gold); }
    .row.top2 .pos { color: var(--silver); }
    .row.top3 .pos { color: var(--bronze); }

    .name {
      font-size: 16px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .votes {
      font-size: 18px;
      font-weight: 700;
      text-align: right;
      color: var(--accent);
    }
    .votes .label {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      font-size: 15px;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid var(--muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      width: 100%;
      max-width: 720px;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <h1>RANKING CUADRILLAS</h1>
    <div class="subtitle">Se buscan cuadrillas · Edición actual</div>
    <div class="status" id="status">Cargando…</div>
  </header>

  <div class="ranking" id="ranking">
    <div class="loading"><span class="spinner"></span>Obteniendo datos…</div>
  </div>

  <footer>Se actualiza automáticamente cada 30 segundos.</footer>

  <script>
    const REFRESH_MS = 30000;
    const rankingEl = document.getElementById('ranking');
    const statusEl = document.getElementById('status');

    function render(ranking) {
      rankingEl.innerHTML = '';
      ranking.forEach((c, i) => {
        const pos = i + 1;
        const row = document.createElement('div');
        row.className = 'row' + (pos <= 3 ? ' top' + pos : '');
        row.innerHTML =
          '<div class="pos">' + pos + '</div>' +
          '<div class="name"></div>' +
          '<div class="votes">' + c.votos + '<span class="label">votos</span></div>';
        row.querySelector('.name').textContent = c.nombre;
        rankingEl.appendChild(row);
      });
    }

    async function refresh() {
      try {
        const res = await fetch('./ranking.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const list = Array.isArray(data) ? data : data.ranking;
        render(list);
        const gen = !Array.isArray(data) && data.updated_at
          ? new Date(data.updated_at).toLocaleString('es-ES')
          : '—';
        statusEl.textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-ES') + ' · Datos: ' + gen;
        statusEl.className = 'status ok';
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
        statusEl.className = 'status error';
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
