name: Update ranking
# Re-registrado: 2026-09-11 (el scheduler no disparaba)

on:
  schedule:
    # Cada 15 min evitando el minuto 0 (la doc advierte de caidas por carga al inicio de cada hora)
    - cron: '3-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-ranking.js
      - name: Commit ranking.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ranking.json
          git diff --staged --quiet || (git commit -m "Update ranking" && git push)
